<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생기부 분석 모임 협업 보드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif; background-color: #DCE7F2; min-height: 100vh; padding: 24px; color: #2c3e50; }

  /* 비밀번호 잠금 */
  .lock-screen { position: fixed; inset: 0; background: #DCE7F2; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { background: white; border-radius: 18px; padding: 40px 36px; box-shadow: 0 12px 40px rgba(70,100,140,0.18); width: 100%; max-width: 380px; text-align: center; }
  .lock-box .lock-icon { font-size: 40px; margin-bottom: 14px; }
  .lock-box h2 { font-size: 19px; color: #34495e; margin-bottom: 8px; }
  .lock-box p { font-size: 13px; color: #6c7a89; margin-bottom: 22px; line-height: 1.5; }
  .lock-box input { width: 100%; padding: 12px 14px; border: 1px solid #d0dae6; border-radius: 10px; font-size: 15px; text-align: center; background: #f7fafd; margin-bottom: 12px; }
  .lock-box input:focus { outline: none; border-color: #5a8bbf; background: white; }
  .lock-box button { width: 100%; padding: 12px; background: #5a8bbf; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .lock-box button:hover { background: #4a7aae; }
  .lock-error { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }

  .conn-status { position: fixed; bottom: 16px; right: 16px; background: white; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; box-shadow: 0 2px 10px rgba(70,100,140,0.15); z-index: 500; display: flex; align-items: center; gap: 6px; }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #aaa; }
  .conn-dot.online { background: #4caf50; }
  .conn-dot.offline { background: #e57373; }

  header { max-width: 1600px; margin: 0 auto 16px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border-radius: 16px; padding: 18px 26px; box-shadow: 0 2px 12px rgba(70,100,140,0.08); }
  h1 { font-size: 21px; color: #34495e; margin-bottom: 6px; font-weight: 700; }
  .subtitle { font-size: 13px; color: #6c7a89; line-height: 1.5; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: rgba(0,0,0,0.55); }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* 학생 탭 */
  .student-tabs { max-width: 1600px; margin: 0 auto 18px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .student-tab { padding: 9px 18px; border-radius: 12px 12px 0 0; border: none; background: rgba(255,255,255,0.55); color: #5a6b7a; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .student-tab:hover { background: rgba(255,255,255,0.85); }
  .student-tab.active { background: white; color: #34495e; box-shadow: 0 -2px 8px rgba(70,100,140,0.1); }
  .student-tab .tab-del { font-size: 12px; color: rgba(0,0,0,0.35); padding: 0 2px; border-radius: 4px; }
  .student-tab .tab-del:hover { color: #c0392b; background: rgba(0,0,0,0.06); }
  .add-student-btn { padding: 9px 16px; border-radius: 10px; border: 1.5px dashed rgba(90,139,191,0.5); background: rgba(255,255,255,0.5); color: #5a8bbf; font-size: 14px; font-weight: 600; cursor: pointer; }
  .add-student-btn:hover { background: white; border-style: solid; }

  .toolbar { max-width: 1600px; margin: 0 auto 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { padding: 10px 18px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: white; color: #34495e; box-shadow: 0 2px 6px rgba(70,100,140,0.1); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(70,100,140,0.15); }
  .btn-primary { background: #5a8bbf; color: white; }
  .btn-primary:hover { background: #4a7aae; }
  .filter-section { margin-left: auto; display: flex; gap: 8px; align-items: center; background: white; padding: 6px 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(70,100,140,0.1); }
  .filter-section label { font-size: 13px; color: #6c7a89; font-weight: 600; }
  .filter-section select { border: none; background: transparent; font-size: 14px; color: #34495e; cursor: pointer; padding: 4px 8px; font-weight: 600; }

  /* 카드 보드 */
  .board { max-width: 1600px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; align-items: start; }
  .card-column { background: rgba(255,255,255,0.32); border-radius: 16px; padding: 14px; border: 1px solid rgba(255,255,255,0.6); }

  /* 카드 (모두 동일한 형태) */
  .card { border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 12px rgba(70,100,140,0.13); word-break: break-word; margin-bottom: 10px; }
  .card.child { margin-left: 16px; position: relative; }
  .card.child::before { content: ''; position: absolute; left: -16px; top: -10px; width: 12px; height: 22px; border-left: 2px dashed rgba(90,139,191,0.4); border-bottom: 2px dashed rgba(90,139,191,0.4); border-bottom-left-radius: 8px; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .card-meta { font-size: 11px; color: rgba(0,0,0,0.55); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card-author { font-weight: 700; color: rgba(0,0,0,0.78); }
  .card-time { color: rgba(0,0,0,0.45); }
  .card-actions { display: flex; gap: 2px; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: rgba(0,0,0,0.4); padding: 2px 5px; line-height: 1; border-radius: 4px; }
  .icon-btn:hover { color: rgba(0,0,0,0.85); background: rgba(0,0,0,0.08); }
  .cat-badge { display: inline-block; background: rgba(0,0,0,0.12); color: rgba(0,0,0,0.78); padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .tag-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px; color: white; letter-spacing: 0.3px; white-space: nowrap; }
  .tag-question { background: #c4a47d; }
  .tag-interpret { background: #9b87b8; }
  .tag-suggest { background: #7d9fc4; }
  .tag-concern { background: #c47d8a; }
  .tag-agree { background: #87b896; }
  .card-content { font-size: 14px; line-height: 1.6; color: rgba(0,0,0,0.85); white-space: pre-wrap; }
  .card-image { margin-top: 10px; }
  .card-image img { max-width: 100%; border-radius: 8px; cursor: pointer; display: block; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }

  /* 카드 작성 폼 */
  .card-form { border-radius: 12px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(70,100,140,0.15); border: 2px solid rgba(90,139,191,0.4); }
  .card-form.child-form { margin-left: 16px; position: relative; }
  .card-form.child-form::before { content: ''; position: absolute; left: -16px; top: -10px; width: 12px; height: 22px; border-left: 2px dashed rgba(90,139,191,0.4); border-bottom: 2px dashed rgba(90,139,191,0.4); border-bottom-left-radius: 8px; }
  .form-label { font-size: 11px; font-weight: 700; color: rgba(0,0,0,0.42); margin: 6px 2px 4px; }
  .form-row-top { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .author-input { flex: 1; min-width: 100px; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 5px 8px; border-radius: 6px; font-size: 12px; font-family: inherit; }
  .tag-selector { display: flex; gap: 3px; flex-wrap: wrap; }
  .tag-btn { border: 1.5px solid transparent; background: rgba(255,255,255,0.85); padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer; color: rgba(0,0,0,0.6); transition: all 0.15s; }
  .tag-btn:hover { border-color: rgba(0,0,0,0.3); }
  .tag-btn.active { color: white; }
  .tag-btn.active[data-tag="question"] { background: #c4a47d; border-color: #c4a47d; }
  .tag-btn.active[data-tag="interpret"] { background: #9b87b8; border-color: #9b87b8; }
  .tag-btn.active[data-tag="suggest"] { background: #7d9fc4; border-color: #7d9fc4; }
  .cat-selector { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; padding: 6px 8px; background: rgba(255,255,255,0.5); border-radius: 8px; }
  .cat-selector-label { font-size: 10px; color: rgba(0,0,0,0.55); font-weight: 700; margin-right: 2px; }
  .cat-btn { border: 1.5px solid rgba(0,0,0,0.12); background: rgba(255,255,255,0.85); padding: 3px 9px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; color: rgba(0,0,0,0.6); transition: all 0.15s; }
  .cat-btn:hover { border-color: rgba(0,0,0,0.3); }
  .cat-btn.active { color: rgba(0,0,0,0.8); }
  .card-form textarea { width: 100%; border: 1px solid rgba(0,0,0,0.15); background: white; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 64px; line-height: 1.55; }
  .card-form textarea:focus, .card-form input:focus { outline: none; border-color: rgba(90,139,191,0.6); }
  .img-attach-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .img-attach-btn { background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.15); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer; color: rgba(0,0,0,0.65); }
  .img-attach-btn:hover { background: white; border-color: rgba(0,0,0,0.3); }
  .img-preview-wrap { position: relative; display: inline-block; }
  .img-preview-wrap img { max-height: 60px; border-radius: 6px; display: block; }
  .img-remove-btn { position: absolute; top: -7px; right: -7px; background: #c0392b; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 1; }
  .form-row-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .form-hint { font-size: 10px; color: rgba(0,0,0,0.5); }
  .form-buttons { display: flex; gap: 4px; }
  .submit-btn { background: #5a8bbf; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .submit-btn:hover { background: #4a7aae; }
  .cancel-btn { background: transparent; color: rgba(0,0,0,0.55); border: none; padding: 6px 10px; cursor: pointer; font-size: 11px; font-weight: 600; }

  /* 사진 확대 */
  .img-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; }
  .img-lightbox.active { display: flex; }
  .img-lightbox img { max-width: 95%; max-height: 95%; border-radius: 8px; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #6c7a89; background: rgba(255,255,255,0.5); border-radius: 16px; border: 2px dashed rgba(90,139,191,0.3); }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: #5a8bbf; }

  @media (max-width: 600px) {
    body { padding: 16px; }
    .board { grid-template-columns: 1fr; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .filter-section { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon">🔒</div>
    <h2>생기부 분석 모임 보드</h2>
    <p>모임 선생님들께 공유된<br>비밀번호를 입력해 주세요.</p>
    <input type="password" id="passwordInput" placeholder="비밀번호">
    <button id="enterBtn">입장하기</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<header>
  <h1>📋 생기부 분석 모임 협업 보드</h1>
  <p class="subtitle">학생별로 페이지를 만들어 생기부 영역별 의견을 공유하는 공간입니다. 모든 카드에 자유롭게 댓글을 달 수 있습니다.</p>
  <div class="legend" style="margin-top:8px;">
    <span style="font-size:11px; font-weight:700; color:rgba(0,0,0,0.5); margin-right:4px;">영역별 색:</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFD6D6"></span>자율활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#C8E6F0"></span>진로활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#D4F0D4"></span>동아리활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFDAB8"></span>봉사활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFF4B8"></span>교과세특</span>
    <span class="legend-item"><span class="legend-dot" style="background:#E0D4F0"></span>독서활동</span>
    <span class="legend-item"><span class="legend-dot" style="background:#F5E1C8"></span>행동특성</span>
    <span class="legend-item"><span class="legend-dot" style="background:#FFFFFF; border:1px solid rgba(0,0,0,0.15)"></span>기타</span>
  </div>
  <div class="legend" style="margin-top:6px;">
    <span style="font-size:11px; font-weight:700; color:rgba(0,0,0,0.5); margin-right:4px;">의견 유형:</span>
    <span class="legend-item">🔍 질문</span>
    <span class="legend-item">💬 해석</span>
    <span class="legend-item">💡 보완</span>
  </div>
</header>

<div class="student-tabs" id="studentTabs"></div>

<div class="toolbar">
  <button class="btn btn-primary" id="addCardBtn">＋ 새 카드 작성</button>
  <div class="filter-section">
    <label>영역 필터:</label>
    <select id="filterCategory">
      <option value="all">전체</option>
      <option value="자율활동">자율활동</option>
      <option value="진로활동">진로활동</option>
      <option value="동아리활동">동아리활동</option>
      <option value="봉사활동">봉사활동</option>
      <option value="교과세특">교과세특</option>
      <option value="독서활동">독서활동</option>
      <option value="행동특성">행동특성 및 종합의견</option>
      <option value="기타">기타</option>
    </select>
  </div>
</div>

<div class="board" id="board"></div>

<div class="conn-status" id="connStatus">
  <span class="conn-dot" id="connDot"></span>
  <span id="connText">연결 중...</span>
</div>

<div class="img-lightbox" id="imgLightbox">
  <img id="imgLightboxImg" src="" alt="확대 이미지">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, update, push }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  /* ============================================================
     ★★★ 설정 (이미 입력되어 있습니다) ★★★
     ============================================================ */
  const firebaseConfig = {
    apiKey: "AIzaSyBtgUL85OIEYat20W8wGideuf8ln1pLrrE",
    authDomain: "edu-92632.firebaseapp.com",
    databaseURL: "https://edu-92632-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "edu-92632",
    storageBucket: "edu-92632.firebasestorage.app",
    messagingSenderId: "897016569304",
    appId: "1:897016569304:web:772fe75213421962c9e6ad",
    measurementId: "G-7YX0GQ6WPC"
  };
  const BOARD_PASSWORD = "ys2026";
  /* ============================================================ */

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const studentsRef = ref(db, 'students');

  const CATEGORY_COLORS = {
    '자율활동': '#FFD6D6', '진로활동': '#C8E6F0', '동아리활동': '#D4F0D4', '봉사활동': '#FFDAB8',
    '교과세특': '#FFF4B8', '독서활동': '#E0D4F0', '행동특성': '#F5E1C8', '기타': '#FFFFFF'
  };
  const CATEGORY_LIST = ['자율활동','진로활동','동아리활동','봉사활동','교과세특','독서활동','행동특성','기타'];
  function categoryColor(cat) { return CATEGORY_COLORS[cat] || '#FFFFFF'; }

  const TAGS = {
    question:  { label: '🔍 질문',  class: 'tag-question' },
    interpret: { label: '💬 해석',  class: 'tag-interpret' },
    suggest:   { label: '💡 보완',  class: 'tag-suggest' }
  };
  const LEGACY_TAGS = { concern: { label: '⚠️ 우려', class: 'tag-concern' }, agree: { label: '✅ 동의', class: 'tag-agree' } };
  function getTag(key) { return TAGS[key] || LEGACY_TAGS[key] || TAGS.question; }

  // 상태
  let students = {};       // {studentId: {name, createdAt, cards: {cardId: {...}}}}
  let currentStudentId = null;
  let editingCard = null;  // {studentId, cardId}
  let formState = {};      // 폼 임시 상태

  /* ---------- 비밀번호 ---------- */
  function checkPassword() {
    const input = document.getElementById('passwordInput').value;
    if (input === BOARD_PASSWORD) {
      sessionStorage.setItem('board_unlocked', '1');
      document.getElementById('lockScreen').style.display = 'none';
    } else {
      document.getElementById('lockError').textContent = '비밀번호가 올바르지 않습니다.';
      document.getElementById('passwordInput').value = '';
    }
  }
  document.getElementById('enterBtn').addEventListener('click', checkPassword);
  document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
  if (sessionStorage.getItem('board_unlocked') === '1') {
    document.getElementById('lockScreen').style.display = 'none';
  } else {
    document.getElementById('passwordInput').focus();
  }

  /* ---------- Firebase 구독 ---------- */
  onValue(studentsRef, (snapshot) => {
    students = snapshot.val() || {};
    setConn(true);
    // 현재 선택된 학생이 없거나 삭제됐으면 첫 학생 선택
    const ids = Object.keys(students);
    if (!currentStudentId || !students[currentStudentId]) {
      currentStudentId = ids.length ? ids.sort((a,b)=>students[a].createdAt-students[b].createdAt)[0] : null;
    }
    renderTabs();
    renderBoard();
  }, (err) => { console.error(err); setConn(false); });

  function setConn(online) {
    const dot = document.getElementById('connDot'), text = document.getElementById('connText');
    if (online) { dot.className = 'conn-dot online'; text.textContent = '실시간 연결됨'; }
    else { dot.className = 'conn-dot offline'; text.textContent = '연결 끊김 (새로고침 해보세요)'; }
  }

  /* ---------- 학생 탭 ---------- */
  function renderTabs() {
    const wrap = document.getElementById('studentTabs');
    const ids = Object.keys(students).sort((a,b)=>students[a].createdAt-students[b].createdAt);
    let html = ids.map(id => `
      <button class="student-tab ${id === currentStudentId ? 'active' : ''}" onclick="selectStudent('${id}')">
        ${escapeHtml(students[id].name || '이름없음')}
        <span class="tab-del" onclick="event.stopPropagation(); deleteStudent('${id}')" title="이 학생 페이지 삭제">✕</span>
      </button>
    `).join('');
    html += `<button class="add-student-btn" onclick="addStudent()">＋ 새 학생 추가</button>`;
    wrap.innerHTML = html;
  }

  window.selectStudent = function(id) { currentStudentId = id; renderTabs(); renderBoard(); };

  window.addStudent = function() {
    const name = prompt('새 학생의 이름(또는 구분명)을 입력하세요.\n예: 김ㅇㅇ, 1반 3번 등');
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) { alert('이름을 입력해주세요.'); return; }
    const newRef = push(studentsRef);
    set(newRef, { name: trimmed, createdAt: Date.now(), cards: {} }).then(() => {
      currentStudentId = newRef.key;
      renderTabs(); renderBoard();
    });
  };

  window.deleteStudent = function(id) {
    const name = students[id] ? (students[id].name || '이 학생') : '이 학생';
    if (!confirm(`'${name}' 페이지를 삭제하시겠습니까?\n이 학생의 모든 카드가 함께 삭제됩니다.`)) return;
    remove(ref(db, `students/${id}`));
  };

  /* ---------- 카드 보드 ---------- */
  function currentCards() {
    if (!currentStudentId || !students[currentStudentId]) return {};
    return students[currentStudentId].cards || {};
  }

  function captureFormInputs() {
    document.querySelectorAll('[data-form-id]').forEach(form => {
      const fid = form.dataset.formId;
      if (!formState[fid]) formState[fid] = {};
      form.querySelectorAll('input[data-field], textarea[data-field]').forEach(el => {
        formState[fid][el.dataset.field] = el.value;
      });
    });
  }

  function renderBoard() {
    captureFormInputs();
    const board = document.getElementById('board');

    if (!currentStudentId) {
      board.innerHTML = `<div class="empty-state"><h3>학생 페이지가 없습니다</h3><p>위의 "＋ 새 학생 추가"를 눌러 첫 학생 페이지를 만들어보세요.</p></div>`;
      return;
    }

    const cardsObj = currentCards();
    const cards = Object.keys(cardsObj).map(id => ({ id, ...cardsObj[id], parentId: cardsObj[id].parentId || null }));
    const filter = document.getElementById('filterCategory').value;

    // 최상위 카드 (부모 없음)
    let roots = cards.filter(c => !c.parentId);
    if (filter !== 'all') roots = roots.filter(c => c.category === filter);
    roots.sort((a,b)=>b.createdAt-a.createdAt);

    // 최상위 카드가 없으면, 새 카드 작성 폼만 표시
    let html = '';
    if (roots.length === 0) {
      html += `<div class="card-column">${renderCardForm(null)}</div>`;
    } else {
      html += roots.map(root => `<div class="card-column">${renderCardTree(root.id, cards, 0)}${renderCardForm(root.id)}</div>`).join('');
      // 새 최상위 카드 작성 칸도 항상 하나
      html += `<div class="card-column">${renderCardForm(null)}</div>`;
    }
    board.innerHTML = html;
    bindFormListeners();
  }

  // 카드와 그 자식(댓글)들을 재귀적으로 렌더
  function renderCardTree(cardId, allCards, depth) {
    const card = allCards.find(c => c.id === cardId);
    if (!card) return '';
    const isEditing = editingCard && editingCard.cardId === cardId && editingCard.studentId === currentStudentId;
    if (isEditing) {
      // 수정 폼 + 자식들
      const children = allCards.filter(c => c.parentId === cardId).sort((a,b)=>a.createdAt-b.createdAt);
      return renderCardForm(card.parentId, card)
        + renderCommentArea(cardId, allCards, depth)
        + children.map(ch => renderCardTree(ch.id, allCards, depth+1)).join('');
    }
    const children = allCards.filter(c => c.parentId === cardId).sort((a,b)=>a.createdAt-b.createdAt);
    const tag = getTag(card.tag);
    const bg = card.category ? categoryColor(card.category) : '#FFFFFF';
    const childClass = depth > 0 ? 'child' : '';

    return `
      <div class="card ${childClass}" style="background:${bg}">
        <div class="card-header">
          <div class="card-meta">
            ${card.category ? `<span class="cat-badge">${escapeHtml(card.category)}</span>` : ''}
            <span class="tag-badge ${tag.class}">${tag.label}</span>
            <span class="card-author">${escapeHtml(card.author || '익명')}</span>
            <span class="card-time">${formatDate(card.createdAt)}${card.editedAt ? ' ·수정' : ''}</span>
          </div>
          <div class="card-actions">
            <button class="icon-btn" onclick="startEditCard('${cardId}')" title="수정">✎</button>
            <button class="icon-btn" onclick="deleteCard('${cardId}')" title="삭제">✕</button>
          </div>
        </div>
        <div class="card-content">${escapeHtml(card.content)}</div>
        ${card.image ? `<div class="card-image"><img src="${card.image}" onclick="openLightbox('${card.image}')" alt="첨부 사진"></div>` : ''}
      </div>
      ${renderCardForm(cardId)}
      ${children.map(ch => renderCardTree(ch.id, allCards, depth+1)).join('')}
    `;
  }

  function renderCommentArea(cardId, allCards, depth) { return ''; }

  // 카드 작성/수정 폼 (parentId=null이면 최상위 새 카드)
  function renderCardForm(parentId, editingCardObj) {
    const isEdit = !!editingCardObj;
    const fid = isEdit ? `editform-${editingCardObj.id}` : `form-${parentId || 'root'}`;
    const isChild = parentId !== null && parentId !== undefined;
    const saved = formState[fid] || (isEdit
      ? { author: editingCardObj.author, content: editingCardObj.content, tag: editingCardObj.tag, category: editingCardObj.category, image: editingCardObj.image || null }
      : {});
    if (!formState[fid]) formState[fid] = saved;
    const bg = saved.category ? categoryColor(saved.category) : '#FFFFFF';

    const imgPreview = saved.image
      ? `<div class="img-preview-wrap"><img src="${saved.image}"><button type="button" class="img-remove-btn" onclick="removeFormImage('${fid}')">✕</button></div>`
      : '';
    const catOptions = CATEGORY_LIST.map(cat => `
      <button class="cat-btn ${saved.category === cat ? 'active' : ''}" style="${saved.category === cat ? `background:${categoryColor(cat)};border-color:rgba(0,0,0,0.35);` : ''}" data-cat="${cat}" onclick="selectFormCategory('${fid}','${cat}')">${cat}</button>
    `).join('');
    const tagOptions = Object.entries(TAGS).map(([k,t]) => `
      <button class="tag-btn ${saved.tag === k ? 'active' : ''}" data-tag="${k}" onclick="selectFormTag('${fid}','${k}')">${t.label}</button>
    `).join('');

    let label = '';
    if (!isEdit) label = `<div class="form-label">💬 ${isChild ? '여기에 댓글 달기' : '＋ 새 카드 작성'}</div>`;

    return `
      ${label}
      <div class="card-form ${isChild ? 'child-form' : ''}" data-form-id="${fid}" style="background:${bg}">
        <div class="form-row-top">
          <input class="author-input" type="text" placeholder="작성자명" data-field="author" value="${escapeHtml(saved.author || '')}">
          <div class="tag-selector">${tagOptions}</div>
        </div>
        <div class="cat-selector"><span class="cat-selector-label">영역</span>${catOptions}</div>
        <textarea data-field="content" placeholder="내용을 입력하세요.">${escapeHtml(saved.content || '')}</textarea>
        <div class="img-attach-row">
          <button type="button" class="img-attach-btn" onclick="this.parentNode.querySelector('input[type=file]').click()">📷 사진</button>
          <input type="file" accept="image/*" style="display:none" onchange="handleFormImage('${fid}', event)">
          ${imgPreview}
        </div>
        <div class="form-row-bottom">
          <span class="form-hint">${isEdit ? '수정 중' : '영역과 유형 태그를 선택해주세요'}</span>
          <div class="form-buttons">
            ${isEdit ? `<button class="cancel-btn" onclick="cancelEdit()">취소</button>` : ''}
            <button class="submit-btn" onclick="${isEdit ? `submitEdit('${editingCardObj.id}','${fid}')` : `submitCard(${parentId ? `'${parentId}'` : 'null'},'${fid}')`}">${isEdit ? '수정 완료' : '등록'}</button>
          </div>
        </div>
      </div>
    `;
  }

  function bindFormListeners() {
    document.querySelectorAll('[data-form-id]').forEach(form => {
      const fid = form.dataset.formId;
      form.querySelectorAll('input[data-field], textarea[data-field]').forEach(el => {
        el.addEventListener('input', () => {
          if (!formState[fid]) formState[fid] = {};
          formState[fid][el.dataset.field] = el.value;
        });
      });
    });
  }

  window.selectFormTag = function(fid, tag) {
    captureFormInputs();
    if (!formState[fid]) formState[fid] = {};
    formState[fid].tag = tag;
    const form = document.querySelector(`[data-form-id="${fid}"]`);
    if (form) form.querySelectorAll('.tag-btn').forEach(b => b.classList.toggle('active', b.dataset.tag === tag));
  };

  window.selectFormCategory = function(fid, cat) {
    captureFormInputs();
    if (!formState[fid]) formState[fid] = {};
    formState[fid].category = cat;
    const form = document.querySelector(`[data-form-id="${fid}"]`);
    if (form) {
      form.style.background = categoryColor(cat);
      form.querySelectorAll('.cat-btn').forEach(b => {
        const on = b.dataset.cat === cat;
        b.classList.toggle('active', on);
        b.style.background = on ? categoryColor(b.dataset.cat) : '';
        b.style.borderColor = on ? 'rgba(0,0,0,0.35)' : '';
      });
    }
  };

  /* ---------- 사진 ---------- */
  function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      if (!file.type.startsWith('image/')) { reject(new Error('이미지 파일이 아닙니다.')); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxSize) { height = Math.round(height*maxSize/width); width = maxSize; }
          else if (height > maxSize) { width = Math.round(width*maxSize/height); height = maxSize; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          let result = canvas.toDataURL('image/jpeg', quality), q = quality;
          while (result.length > 700000 && q > 0.3) { q -= 0.15; result = canvas.toDataURL('image/jpeg', q); }
          resolve(result);
        };
        img.onerror = () => reject(new Error('이미지를 불러올 수 없습니다.'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다.'));
      reader.readAsDataURL(file);
    });
  }

  window.handleFormImage = async function(fid, event) {
    const file = event.target.files[0];
    if (!file) return;
    captureFormInputs();
    try {
      const data = await compressImage(file, 1000, 0.7);
      if (!formState[fid]) formState[fid] = {};
      formState[fid].image = data;
      renderBoard();
    } catch (err) { alert('사진 처리 실패: ' + err.message); }
    event.target.value = '';
  };
  window.removeFormImage = function(fid) { captureFormInputs(); if (formState[fid]) formState[fid].image = null; renderBoard(); };
  window.openLightbox = function(src) { document.getElementById('imgLightboxImg').src = src; document.getElementById('imgLightbox').classList.add('active'); };
  document.getElementById('imgLightbox').addEventListener('click', function(){ this.classList.remove('active'); });

  /* ---------- 카드 저장 ---------- */
  window.submitCard = function(parentId, fid) {
    captureFormInputs();
    const s = formState[fid] || {};
    const hasText = s.content && s.content.trim();
    if (!hasText && !s.image) { alert('내용을 입력하거나 사진을 첨부해주세요.'); return; }
    if (!s.category) { alert('영역을 선택해주세요. (자율활동/진로활동 등)'); return; }
    if (!s.tag) { alert('유형 태그를 선택해주세요. (질문/해석/보완 중 하나)'); return; }
    if (!currentStudentId) { alert('먼저 학생 페이지를 선택해주세요.'); return; }
    const cardsRef = ref(db, `students/${currentStudentId}/cards`);
    const newRef = push(cardsRef);
    set(newRef, {
      author: (s.author || '').trim(),
      content: hasText ? s.content.trim() : '',
      tag: s.tag,
      category: s.category,
      color: categoryColor(s.category),
      image: s.image || null,
      parentId: parentId,
      createdAt: Date.now()
    });
    delete formState[fid];
    renderBoard();
  };

  window.startEditCard = function(cardId) { captureFormInputs(); editingCard = { studentId: currentStudentId, cardId }; renderBoard(); };
  window.cancelEdit = function() { if (editingCard) delete formState[`editform-${editingCard.cardId}`]; editingCard = null; renderBoard(); };

  window.submitEdit = function(cardId, fid) {
    captureFormInputs();
    const s = formState[fid] || {};
    const hasText = s.content && s.content.trim();
    if (!hasText && !s.image) { alert('내용을 입력하거나 사진을 첨부해주세요.'); return; }
    const updates = { author: (s.author || '').trim(), content: hasText ? s.content.trim() : '', image: s.image || null, editedAt: Date.now() };
    if (s.tag) updates.tag = s.tag;
    if (s.category) { updates.category = s.category; updates.color = categoryColor(s.category); }
    update(ref(db, `students/${currentStudentId}/cards/${cardId}`), updates);
    delete formState[fid];
    editingCard = null;
    renderBoard();
  };

  window.deleteCard = async function(cardId) {
    if (!confirm('이 카드를 삭제하시겠습니까? 이 카드에 달린 댓글도 함께 삭제됩니다.')) return;
    const cardsObj = currentCards();
    const toDelete = new Set([cardId]);
    let changed = true;
    while (changed) {
      changed = false;
      Object.keys(cardsObj).forEach(id => {
        const p = cardsObj[id].parentId;
        if (p && toDelete.has(p) && !toDelete.has(id)) { toDelete.add(id); changed = true; }
      });
    }
    for (const id of toDelete) await remove(ref(db, `students/${currentStudentId}/cards/${id}`));
  };

  document.getElementById('addCardBtn').addEventListener('click', () => {
    if (!currentStudentId) { alert('먼저 "＋ 새 학생 추가"로 학생 페이지를 만들어주세요.'); return; }
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });
  document.getElementById('filterCategory').addEventListener('change', renderBoard);

  /* ---------- 유틸 ---------- */
  function escapeHtml(text) { if (!text && text !== '') return ''; const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
  function formatDate(ts) { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`; }
</script>

</body>
